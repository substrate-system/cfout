name: Node CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: npm install, lint, build, and test
        run: |
          npm install
          npm run lint
          npm run build --if-present
          npm test
        env:
          CI: true
